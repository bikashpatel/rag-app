name: rag-app

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  QDRANT_URL: http://qdrant:6333
  UPLOAD_DIR: /data/uploads
  # Use LiteLLM's bundled price/context map instead of fetching it from GitHub at startup.
  LITELLM_LOCAL_MODEL_COST_MAP: "True"
  # Shown in Admin -> System and written to backup manifests, e.g. APP_VERSION=$(git describe) docker compose up -d.
  APP_VERSION: ${APP_VERSION:-}

# The backup and restore services (scripts/backup/backup.sh): the pinned postgres image has pg_dump, pg_restore, psql,
# tar and busybox. They get only the settings they need, never the whole .env.
x-backup: &backup
  image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
  entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
  environment:
    PGHOST: postgres
    PGPORT: "5432"
    PGUSER: ${POSTGRES_USER:-rag}
    PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    PGDATABASE: ${POSTGRES_DB:-rag}
    QDRANT_URL: http://qdrant:6333
    QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-rag_chunks}
    APP_VERSION: ${APP_VERSION:-}
    BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-02:30}
    BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
    BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    BACKUP_START_DELAY_SECONDS: ${BACKUP_START_DELAY_SECONDS:-120}
    BACKUP_UID: ${BACKUP_UID:-}
    BACKUP_GID: ${BACKUP_GID:-}

# Images are pinned by digest to builds at least two weeks old; bump them deliberately.
services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.11-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    # uvicorn cancels open answer streams 15 s after SIGTERM (Dockerfile); the rest is time for them
    # to save their partial answers. Docker's default of 10 s would kill it first.
    stop_grace_period: 30s
    env_file: .env
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
      - backupstatus:/backup-status:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    # Running jobs get up to 60 s to finish on shutdown (app/worker.py); Docker's default is 10 s.
    stop_grace_period: 75s
    # PDF pages are rendered in child processes limited to 1 GiB each (app/services/pdf_images.py); this caps
    # the whole worker, so anything else that runs away is OOM-killed inside the container.
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    memswap_limit: ${WORKER_MEM_LIMIT:-4g}
    env_file: .env
    environment: *backend-env
    volumes:
      - uploads:/data/uploads
    # Healthy while its heartbeat in Redis is fresh (app/ops/heartbeat.py).
    healthcheck:
      test: ["CMD", "python", "-m", "app.ops.heartbeat"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      # nginx's upload body limit follows it (frontend/upload-limit.envsh); pass nothing else from .env.
      MAX_UPLOAD_MB_HARD: ${MAX_UPLOAD_MB_HARD:-100}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      backend:
        condition: service_healthy

  # Checks every service, the app through nginx, backups and disks every MONITOR_INTERVAL_SECONDS and sends alerts on
  # state changes to the ALERT_* channels (app/ops/monitor.py). The only service that sends alerts.
  monitor:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.ops.monitor"]
    env_file: .env
    environment: *backend-env
    volumes:
      - uploads:/data/uploads:ro
      - backupstatus:/backup-status:ro
    healthcheck:
      test: ["CMD", "python", "-m", "app.ops.monitor", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  # Daily backups at BACKUP_SCHEDULE (UTC) into BACKUP_DIR, plus one shortly after start while there is none
  # (scripts/README.md). BACKUP_DIR holds personal data: keep it outside every build context and out of git.
  backup:
    <<: *backup
    restart: unless-stopped
    command: ["schedule"]
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - uploads:/data/uploads:ro
      - backupstatus:/status
      - ./scripts/backup:/opt/backup:ro
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/backup/backup.sh", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      # The backend creates the schema and the uploads volume's owner first.
      backend:
        condition: service_healthy

  # Used only by scripts/restore.sh (docker compose run --rm restore ...): the backups read-only, the uploads writable.
  restore:
    <<: *backup
    profiles: ["restore"]
    restart: "no"
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - uploads:/data/uploads
      - backupstatus:/status
      - ./scripts/backup:/opt/backup:ro

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  uploads:
  # The backup service's status file (no personal data), read by the backend and the monitor.
  backupstatus:
