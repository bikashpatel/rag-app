# Every suite of the repo on a fresh runner. Nothing here calls a real model provider or Google: provider keys are fake,
# the e2e suite answers chats with canned events, and the integration stack has no route to the internet.
# Actions are pinned to full commit SHAs (version in the comment), released at least two weeks before adoption.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The same Python and Node as the backend and frontend images (backend/Dockerfile, frontend/Dockerfile).
  PYTHON_VERSION: "3.13.15"
  NODE_VERSION: "22.23.3"
  # uvx resolves ruff and mypy (and mypy's own dependencies) from releases up to the adoption cutoff only.
  UV_EXCLUDE_NEWER: "2026-10-12T00:00:00Z"

jobs:
  backend:
    name: Backend (ruff, mypy, pytest with coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: false
      - name: Install the locked requirements
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/pip check
      - name: ruff
        run: uvx ruff@0.13.0 check --target-version py313 --line-length 120 --select E,F,W,I,B --ignore B008 app tests
      - name: mypy
        run: uvx mypy@1.18.2 --python-executable .venv/bin/python --ignore-missing-imports app
      - name: pytest with coverage
        run: .venv/bin/python -m pytest -q --cov --cov-report=term-missing:skip-covered --cov-fail-under=94

  backend-postgres:
    name: Backend on Postgres (postgres-marked tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install the locked requirements
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes --no-deps -r requirements-dev.txt
          .venv/bin/pip check
      - name: pytest -m postgres
        run: .venv/bin/python -m pytest -q -m postgres

  frontend:
    name: Frontend (tsc, Vitest with coverage, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npx vite build

  e2e:
    name: End-to-end (Playwright against the Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Never the rag-app project name of docker-compose.yml, so these steps can't touch a real stack wherever they run.
      COMPOSE_PROJECT_NAME: rag-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Write a throwaway .env (random secrets, fake provider keys)
        run: |
          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path

          values = {
              "ADMIN_USERNAME": "admin",
              "ADMIN_PASSWORD": secrets.token_urlsafe(24),
              "SECRET_KEY": secrets.token_urlsafe(48),
              "POSTGRES_PASSWORD": secrets.token_urlsafe(24),
              "OPENAI_API_KEY": "sk-ci-fake",
              "ANTHROPIC_API_KEY": "sk-ant-ci-fake",
          }
          for name in ("ADMIN_PASSWORD", "SECRET_KEY", "POSTGRES_PASSWORD"):
              print(f"::add-mask::{values[name]}")
          lines = []
          for line in Path(".env.example").read_text().splitlines():
              name, equals, _ = line.partition("=")
              lines.append(f"{name}={values.pop(name)}" if equals and name in values else line)
          if values:
              raise SystemExit(f".env.example has no line for {sorted(values)}")
          with os.fdopen(os.open(".env", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), "w") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Install the e2e dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Type-check the e2e suite
        working-directory: e2e
        run: npx tsc --noEmit
      - name: Playwright
        working-directory: e2e
        env:
          CI: "1"
        run: |
          export E2E_ADMIN_USERNAME=admin
          E2E_ADMIN_PASSWORD=$(sed -n 's/^ADMIN_PASSWORD=//p' ../.env)
          export E2E_ADMIN_PASSWORD
          npx playwright test
      - name: Save the stack logs
        if: failure()
        run: docker compose logs --no-color > "$RUNNER_TEMP/e2e-stack-logs.txt" 2>&1
      - name: Upload the Playwright report and test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Upload the stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stack-logs
          path: ${{ runner.temp }}/e2e-stack-logs.txt
          retention-days: 7
      - name: Remove the stack
        if: always()
        run: docker compose down -v --remove-orphans

  integration:
    name: Integration (isolated stack with fake models and Google)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24"
          enable-cache: false
      - name: Install the locked requirements
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --require-hashes --no-deps -r backend/requirements-dev.txt
          backend/.venv/bin/pip check
      - name: ruff
        run: |
          uvx ruff@0.13.0 check --target-version py313 --line-length 120 --select E,F,W,I,B --ignore B008 integration
          uvx ruff@0.13.0 format --line-length 120 --check integration
      - name: Integration suite
        env:
          IT_LOGS: ${{ runner.temp }}/rag-it-stack-logs.txt
        run: integration/run.sh --rmi
      - name: Upload the stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-stack-logs
          path: ${{ runner.temp }}/rag-it-stack-logs.txt
          retention-days: 7
