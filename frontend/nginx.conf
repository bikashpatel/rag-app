# Template: the nginx image renders it to /etc/nginx/conf.d/default.conf (inside the http block) at
# container start, substituting only NGINX_* variables (see Dockerfile and upload-limit.envsh).

# SameSite cookies ignore ports, so pages on other localhost ports count as same-site and get the
# session cookie. Refuse state-changing requests the browser marks as coming from another origin.
map "$request_method:$http_sec_fetch_site" $xsite_write {
    default 0;
    "~^(POST|PUT|PATCH|DELETE):(same-site|cross-site)$" 1;
}

# Plugin requests and Razorpay's are access-logged by path only ($uri, not $request; no referer): a query string there
# could hold mail search terms, addresses, OAuth codes, payment ids or a signature.
log_format path_only '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent"';

# Razorpay's two endpoints take no session: rate-limited per client address (behind the Cloudflare tunnel that is the
# visitor's address only with NGINX_REAL_IP_FROM set, see real-ip.envsh; without it every tunnelled request shares
# the tunnel's address, so these are generous on purpose).
limit_req_zone $binary_remote_addr zone=billing_return:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=billing_webhook:1m rate=120r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI reads a request body before authentication runs, so only the upload route below
    # accepts large bodies. JSON bodies are small (a chat request is at most a few hundred KB).
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    if ($xsite_write) {
        return 403;
    }

    # OAuth callbacks (Google redirects the browser here): the query holds a one-time code and the state, so neither
    # the access log nor an upstream error (which would print the request line) may record it.
    location ~ ^/api/plugins/[a-z0-9_]+/oauth/callback$ {
        access_log off;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Razorpay sends the browser back here (a cross-site GET: no session cookie arrives). The query holds payment ids
    # and a signature, so only the path is logged, and errors only at crit (an upstream error logs the request line).
    location = /api/billing/razorpay/return {
        limit_req zone=billing_return burst=20 nodelay;
        limit_req_status 429;
        access_log /var/log/nginx/access.log path_only;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Razorpay's server-to-server webhooks: no Sec-Fetch-Site header, so the cross-site guard lets them through; a
    # browser's cross-site POST here is still refused by it. The backend checks the HMAC signature.
    location = /api/billing/razorpay/webhook {
        limit_except POST { deny all; }
        limit_req zone=billing_webhook burst=60 nodelay;
        limit_req_status 429;
        client_max_body_size 256k;
        access_log /var/log/nginx/access.log path_only;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    # The other plugin routes (the Gmail browser searches with a POST body, never a query): as /api/, logged by path.
    # No trailing slash: nginx answers a proxied prefix ending in "/" with a 301 for the bare path, which would
    # break GET /api/plugins (the list).
    location /api/plugins {
        access_log /var/log/nginx/access.log path_only;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Streaming chat (SSE): never buffer responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Uploads (POST) and the document list (GET). MAX_UPLOAD_MB_HARD plus multipart overhead; the
    # backend enforces each user's exact limit while streaming.
    location = /api/documents {
        client_max_body_size ${NGINX_UPLOAD_BODY_MB}m;
        # Check the session and the plan before any upload body reaches the backend.
        auth_request /_upload_auth;
        error_page 401 = @upload_unauthorized;
        error_page 403 = @upload_plan_required;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Stream uploads straight to the backend
        proxy_request_buffering off;
    }

    location = /_upload_auth {
        internal;
        # The subrequest is checked against the upload's Content-Length, so it needs the same limit.
        client_max_body_size ${NGINX_UPLOAD_BODY_MB}m;
        # $request_method is the upload request's; the backend authenticates the list (GET) itself.
        if ($request_method != POST) {
            return 204;
        }

        proxy_pass http://backend:8000/api/auth/upload-allowed;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Content-Type "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @upload_unauthorized {
        default_type application/json;
        return 401 '{"detail":"Not authenticated"}';
    }

    location @upload_plan_required {
        default_type application/json;
        return 402 '{"detail":"You need an active plan to upload documents.","code":"plan_required"}';
    }

    # The public policy pages' text (Markdown files in the repo, fetched by the SPA's public pages).
    location /legal/ {
        types { text/markdown md; }
        charset utf-8;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Loaded blocking in <head> before the first paint: a revalidation per page load would delay it, so cache it
    # briefly (after a deploy a browser may run the previous version for up to 5 minutes; the bundle re-applies).
    location = /theme-boot.js {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
