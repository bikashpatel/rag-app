# Alembic's command line, for writing migrations (migrations/README.md). The app runs them itself at start-up
# (app.db.init_db); the command line connects with the app's settings (DATABASE_URL or the POSTGRES_* variables).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
# Revision ids are numbered by hand: alembic revision --autogenerate --rev-id 0003 -m "..."
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
