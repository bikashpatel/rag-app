[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# One event loop for the whole run: the app keeps module-level asyncio locks, which must not
# be shared between loops. Every test still gets fresh app state (see tests/conftest.py).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    # fakeredis passes constructor arguments that redis-py 8 deprecates.
    ignore:Call to '__init__' function with deprecated usage of input argument/s '(retry_on_timeout|lib_name|lib_version)':DeprecationWarning
    # The in-memory Qdrant used by the tests has no payload indexes (the server does).
    ignore:Payload indexes have no effect in the local Qdrant:UserWarning
